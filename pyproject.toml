[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logi-center"
dynamic = ["version"]
description = "Capability-driven Linux peripheral manager with a Qt6/QML interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6>=6.6", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pycairo", "build"]

[project.scripts]
logi-center = "logi_center.cli:main"

[project.urls]
Repository = "https://github.com/Mirox921/logi-center"

[tool.setuptools.dynamic]
version = {attr = "logi_center.version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["logi_center*"]

[tool.setuptools.package-data]
"logi_center.qml_ui" = ["qml/*.qml", "qml/Theme/*.qml", "qml/Theme/qmldir"]
